services:
  backend:
    build: ./backend
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Data Source=/data/todo.db
      - Admin__Email=admin@test.test
      - Admin__Password=Admin123
    volumes:
      - todo-data:/data

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  todo-data: