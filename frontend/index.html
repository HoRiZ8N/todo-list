<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Todo List</title>
  <link rel="stylesheet" href="styles/style.css" />
</head>
<body>
  <main>
    <h1>Todo List</h1>

    <section id="auth-section">
      <form id="login-form">
        <input id="email" type="email" placeholder="Email" required />
        <input id="password" type="password" placeholder="Пароль" required minlength="6" />
        <input id="password-confirm" type="password" placeholder="Повторите пароль (для регистрации)" />
        <ul id="password-hints" class="hints">
          <li id="hint-length">Минимум 6 символов</li>
          <li id="hint-match">Пароли совпадают</li>
        </ul>
        <button type="submit">Войти</button>
        <button type="button" id="register-btn">Зарегистрироваться</button>
      </form>
      <p id="auth-error" class="error"></p>
    </section>

    <section id="app-section" class="hidden">
      <div class="header">
        <span>Роль: <strong id="role-label"></strong></span>
        <button id="logout-btn">Выйти</button>
      </div>

      <div id="tabs" class="tabs hidden">
        <button type="button" id="tab-todos" class="tab active">Задачи</button>
        <button type="button" id="tab-users" class="tab">Пользователи</button>
      </div>

      <div id="todos-tab">
        <div class="filter-row">
          <input id="category-filter" type="text" placeholder="Фильтр по категории" />
          <button type="button" id="filter-btn">Фильтровать</button>
          <button type="button" id="filter-clear-btn">Сбросить</button>
        </div>

        <div class="calendar">
          <div class="calendar-nav">
            <button type="button" id="prev-month" class="nav-btn" aria-label="Предыдущий месяц">&lsaquo;</button>
            <span id="month-label" class="month-label"></span>
            <button type="button" id="next-month" class="nav-btn" aria-label="Следующий месяц">&rsaquo;</button>
            <button type="button" id="today-btn" class="today-btn">Сегодня</button>
          </div>
          <div class="calendar-weekdays">
            <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
          </div>
          <div id="calendar-grid" class="calendar-grid"></div>
        </div>

        <div class="day-panel">
          <h2 id="day-title" class="day-title"></h2>

          <form id="todo-form">
            <input id="title" type="text" placeholder="Новая задача на этот день" required />
            <input id="category" type="text" placeholder="Категория (необязательно)" />
            <select id="priority">
              <option value="0">Низкий приоритет</option>
              <option value="1" selected>Средний приоритет</option>
              <option value="2">Высокий приоритет</option>
            </select>
            <button type="submit">Добавить</button>
          </form>

          <ul id="todo-list"></ul>
        </div>
      </div>

      <div id="users-tab" class="hidden">
        <table id="users-table">
          <thead>
            <tr>
              <th>Email</th>
              <th>Роль</th>
              <th>Статус</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="users-tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="dist/main.js"></script>
</body>
</html>
