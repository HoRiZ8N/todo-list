<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Todo List</title>
  <link rel="stylesheet" href="styles/style.css" />
</head>
<body>
  <main>
    <h1>Todo List</h1>

    <section id="auth-section">
      <form id="login-form">
        <input id="email" type="email" placeholder="Email" required />
        <input id="password" type="password" placeholder="Password" required minlength="6" />
        <input id="password-confirm" type="password" placeholder="Repeat password (for sign up)" />
        <ul id="password-hints" class="hints">
          <li id="hint-length">At least 6 characters</li>
          <li id="hint-digit">At least one digit (0-9)</li>
          <li id="hint-lower">Lowercase letter (a-z)</li>
          <li id="hint-upper">Uppercase letter (A-Z)</li>
          <li id="hint-match">Passwords match</li>
        </ul>
        <button type="submit">Log in</button>
        <button type="button" id="register-btn">Sign up</button>
      </form>
      <div id="auth-error" class="error"></div>
    </section>

    <section id="app-section" class="hidden">
      <div class="header">
        <span>Role: <strong id="role-label"></strong></span>
        <button id="logout-btn">Log out</button>
      </div>

      <div id="tabs" class="tabs hidden">
        <button type="button" id="tab-todos" class="tab active">Tasks</button>
        <button type="button" id="tab-users" class="tab">Users</button>
      </div>

      <div id="todos-tab">
        <div class="filter-row">
          <input id="category-filter" type="text" placeholder="Filter by category" />
          <button type="button" id="filter-btn">Filter</button>
          <button type="button" id="filter-clear-btn">Reset</button>
        </div>

        <div class="calendar">
          <div class="calendar-nav">
            <button type="button" id="prev-month" class="nav-btn" aria-label="Previous month">&lsaquo;</button>
            <span id="month-label" class="month-label"></span>
            <button type="button" id="next-month" class="nav-btn" aria-label="Next month">&rsaquo;</button>
            <button type="button" id="today-btn" class="today-btn">Today</button>
          </div>
          <div class="calendar-weekdays">
            <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
          </div>
          <div id="calendar-grid" class="calendar-grid"></div>
        </div>

        <div class="day-panel">
          <h2 id="day-title" class="day-title"></h2>

          <form id="todo-form">
            <input id="title" type="text" placeholder="New task for this day" required />
            <input id="category" type="text" placeholder="Category (optional)" />
            <select id="priority">
              <option value="0">Low priority</option>
              <option value="1" selected>Medium priority</option>
              <option value="2">High priority</option>
            </select>
            <button type="submit">Add</button>
          </form>

          <ul id="todo-list"></ul>
        </div>
      </div>

      <div id="users-tab" class="hidden">
        <table id="users-table">
          <thead>
            <tr>
              <th>Email</th>
              <th>Role</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="users-tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="dist/main.js"></script>
</body>
</html>
