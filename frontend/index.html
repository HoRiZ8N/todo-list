<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Todo List</title>
  <link rel="stylesheet" href="styles/style.css" />
</head>
<body>
  <main>
    <h1>Todo List</h1>

    <section id="auth-section">
      <div id="login-view">
        <h2 class="auth-title">Log in</h2>
        <form id="login-form" class="auth-form">
          <input id="login-email" type="email" placeholder="Email" autocomplete="username" required />
          <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" required />
          <button type="submit">Log in</button>
        </form>
        <div id="login-error" class="error"></div>
        <p class="auth-switch">Don't have an account? <a href="#register">Sign up</a></p>
      </div>

      <div id="register-view" class="hidden">
        <h2 class="auth-title">Sign up</h2>
        <form id="register-form" class="auth-form">
          <input id="register-email" type="email" placeholder="Email" autocomplete="email" required />
          <input id="register-password" type="password" placeholder="Password" autocomplete="new-password" required />
          <input id="register-password-confirm" type="password" placeholder="Repeat password" autocomplete="new-password" required />
          <ul class="hints">
            <li id="hint-length">At least 6 characters</li>
            <li id="hint-digit">At least one digit (0-9)</li>
            <li id="hint-lower">Lowercase letter (a-z)</li>
            <li id="hint-upper">Uppercase letter (A-Z)</li>
            <li id="hint-match">Passwords match</li>
          </ul>
          <button type="submit">Create account</button>
        </form>
        <div id="register-error" class="error"></div>
        <p class="auth-switch">Already have an account? <a href="#login">Log in</a></p>
      </div>
    </section>

    <section id="app-section" class="hidden">
      <div class="header">
        <span>Role: <strong id="role-label"></strong></span>
        <button id="logout-btn">Log out</button>
      </div>

      <div id="todos-tab">
        <div class="filter-row">
          <input id="category-filter" type="text" placeholder="Filter by category" />
          <button type="button" id="filter-btn">Filter</button>
          <button type="button" id="filter-clear-btn">Reset</button>
        </div>

        <div class="calendar">
          <div class="calendar-nav">
            <button type="button" id="prev-month" class="nav-btn" aria-label="Previous month">&lsaquo;</button>
            <span id="month-label" class="month-label"></span>
            <button type="button" id="next-month" class="nav-btn" aria-label="Next month">&rsaquo;</button>
            <button type="button" id="today-btn" class="today-btn">Today</button>
          </div>
          <div class="calendar-weekdays">
            <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
          </div>
          <div id="calendar-grid" class="calendar-grid"></div>
        </div>

        <div class="day-panel">
          <h2 id="day-title" class="day-title"></h2>

          <form id="todo-form">
            <input id="title" type="text" placeholder="New task for this day" required />
            <input id="category" type="text" placeholder="Category (optional)" />
            <select id="priority">
              <option value="0">Low priority</option>
              <option value="1" selected>Medium priority</option>
              <option value="2">High priority</option>
            </select>
            <button type="submit">Add</button>
          </form>

          <ul id="todo-list"></ul>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="dist/main.js"></script>
</body>
</html>
